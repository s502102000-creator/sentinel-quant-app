name: Sentinel Market Data Health Check

on:
  schedule:
    # Runs automatically at 21:00 UTC (US Market Close / 5:00 AM Taiwan Time) Monday through Friday
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 curl_cffi

      - name: Run Market Close Scanner & Alert Engine
        run: python update_data.py

      - name: Report result without writing to main
        run: |
          echo "Live market data is served by Netlify; this workflow does not push commits to main."

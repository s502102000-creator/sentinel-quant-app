name: Sentinel Automated Market Close Scanner & GitHub Pages Auto-Deploy

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs automatically at 21:00 UTC (US Market Close / 5:00 AM Taiwan Time) Monday through Friday
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 curl_cffi

      - name: Run Market Close Scanner & Alert Engine
        run: python update_data.py

      - name: Commit & Push Updated Data to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html sentinel_live_data.json
          git commit -m "auto: 🤖 每日美股收盤全指標數據自動更新 [$(date +'%Y-%m-%d %H:%M:%S')]" || exit 0
          git push
